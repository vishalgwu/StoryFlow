name: Editor checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-verification-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
